# Configuración de Streamlit para este proyecto (opciones según `streamlit config show`, versión 1.65).

[browser]
# El sistema es 100 % local: no se envían estadísticas de uso a Streamlit.
gatherUsageStats = false

[server]
# Solo accesible desde este computador.
address = "localhost"
# Sin vigilancia de archivos: la app no se recarga sola al editar código, pero se evita revisar miles de módulos de
# `transformers` en cada arranque (ruido en el registro y arranque más lento).
fileWatcherType = "none"

[client]
# Vista de usuario final: sin Deploy ni el menú de Streamlit (sus opciones solo están en inglés).
toolbarMode = "minimal"

[theme]
# Tema propio sin fuentes externas (el sistema funciona sin internet): títulos en serif, texto en sans-serif.
base = "light"
primaryColor = "#0B6E79"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#E8EDF3"
textColor = "#16233A"
borderColor = "#CDD6E0"
linkColor = "#0B6E79"
font = "sans-serif"
headingFont = "serif"
headingFontSizes = ["2rem", "1.5rem", "1.15rem"]
baseRadius = "small"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#16233A"
secondaryBackgroundColor = "#22324D"
textColor = "#E6ECF3"
primaryColor = "#5FC4CF"
borderColor = "#2E4263"

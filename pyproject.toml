[project]
name = "videoqa"
version = "0.1.0"
description = "Preguntas y respuestas sobre el contenido de un video con Whisper, RAG y un LLM local"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integracion'"
markers = ["integracion: usa modelos reales u Ollama; se ejecuta aparte con -m integracion"]
